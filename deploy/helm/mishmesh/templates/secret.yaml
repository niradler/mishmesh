{{- include "mishmesh.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mishmesh.fullname" . }}
  labels:
    {{- include "mishmesh.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not $v.apiAuth.disabled }}
  api-auth-token: {{ include "mishmesh.stableValue" (dict "root" . "key" "api-auth-token" "value" $v.secrets.apiAuthToken) | b64enc | quote }}
  {{- end }}
  endpoint-oidc-key: {{ include "mishmesh.stableValue" (dict "root" . "key" "endpoint-oidc-key" "value" $v.secrets.endpointOIDCKey) | b64enc | quote }}
  {{- if $v.cluster.enabled }}
  cluster-secret: {{ include "mishmesh.stableValue" (dict "root" . "key" "cluster-secret" "value" $v.secrets.clusterSecret) | b64enc | quote }}
  {{- end }}
  {{- if or $v.secrets.bootstrapToken $v.secrets.generateBootstrapToken }}
  bootstrap-token: {{ include "mishmesh.stableValue" (dict "root" . "key" "bootstrap-token" "value" $v.secrets.bootstrapToken) | b64enc | quote }}
  {{- end }}
  {{- if $v.secrets.googleClientSecret }}
  google-client-secret: {{ $v.secrets.googleClientSecret | b64enc | quote }}
  {{- end }}
  {{- if $v.secrets.metricsToken }}
  metrics-token: {{ $v.secrets.metricsToken | b64enc | quote }}
  {{- end }}
  {{- if and $v.postgres.external.url (not $v.postgres.external.existingSecret) }}
  {{ $v.postgres.external.existingSecretKey }}: {{ $v.postgres.external.url | b64enc | quote }}
  {{- end }}
  {{- if and (eq $v.connStore.backend "redis") $v.connStore.redis.url (not $v.connStore.redis.existingSecret) }}
  {{ $v.connStore.redis.existingSecretKey }}: {{ $v.connStore.redis.url | b64enc | quote }}
  {{- end }}
  {{- if and $v.listeners.ssh.enabled $v.ssh.hostKey.generate (not $v.ssh.hostKey.existingSecret) }}
  {{ $v.ssh.hostKey.existingSecretKey }}: {{ include "mishmesh.stableValue" (dict "root" . "key" $v.ssh.hostKey.existingSecretKey "kind" "ed25519") | b64enc | quote }}
  {{- end }}
{{- end }}
