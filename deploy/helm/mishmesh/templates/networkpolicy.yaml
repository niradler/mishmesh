{{- if .Values.networkPolicy.enabled }}
{{- $v := .Values }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mishmesh.fullname" . }}
  labels:
    {{- include "mishmesh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mishmesh.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ $v.listeners.http.containerPort }}
          protocol: TCP
        {{- if $v.listeners.https.enabled }}
        - port: {{ $v.listeners.https.containerPort }}
          protocol: TCP
        {{- end }}
        {{- if $v.listeners.tlsPassthrough.enabled }}
        - port: {{ $v.listeners.tlsPassthrough.containerPort }}
          protocol: TCP
        {{- end }}
        {{- if $v.listeners.ssh.enabled }}
        - port: {{ $v.listeners.ssh.containerPort }}
          protocol: TCP
        {{- end }}
        {{- if $v.listeners.tcp.enabled }}
        - port: {{ $v.listeners.tcp.portMin }}
          endPort: {{ $v.listeners.tcp.portMax }}
          protocol: TCP
        {{- end }}
    - ports:
        - port: {{ $v.listeners.api.containerPort }}
          protocol: TCP
      {{- with $v.networkPolicy.apiAllowedFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if $v.cluster.enabled }}
    - ports:
        - port: {{ $v.cluster.relayPort }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "mishmesh.selectorLabels" . | nindent 14 }}
    {{- end }}
{{- end }}
