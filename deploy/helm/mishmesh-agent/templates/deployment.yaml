{{- $root := . -}}
{{- $v := .Values -}}
{{- if not $v.tunnels }}
{{- fail "tunnels must list at least one tunnel" }}
{{- end }}
{{- range $t := $v.tunnels }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $t.name)) }}
{{- fail (printf "tunnel name %q must be a DNS label" $t.name) }}
{{- end }}
{{- if not (has $t.kind (list "http" "tcp")) }}
{{- fail (printf "tunnel %q: kind must be http or tcp" $t.name) }}
{{- end }}
{{- if not $t.target }}
{{- fail (printf "tunnel %q: target is required (host:port)" $t.name) }}
{{- end }}
{{- $ref := include "mishmesh-agent.tokenRef" (dict "root" $root "tunnel" $t) | fromJson }}
{{- $fullname := printf "%s-%s" (include "mishmesh-agent.fullname" $root) $t.name | trunc 63 | trimSuffix "-" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mishmesh-agent.labels" $root | nindent 4 }}
    app.kubernetes.io/component: agent
    mishmesh.io/tunnel: {{ $t.name }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mishmesh-agent.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      mishmesh.io/tunnel: {{ $t.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mishmesh-agent.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: agent
        mishmesh.io/tunnel: {{ $t.name }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      {{- with $v.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $v.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: {{ printf "%s:%s" $v.image.repository (default $root.Chart.AppVersion $v.image.tag) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args: {{ include "mishmesh-agent.args" $t }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          env:
            - name: MISHMESH_GATEWAY_URL
              value: {{ $v.gatewayURL | quote }}
            - name: MISHMESH_LOG_LEVEL
              value: {{ $v.logLevel | quote }}
            {{- with $v.allow }}
            - name: MISHMESH_ALLOW
              value: {{ . | quote }}
            {{- end }}
            - name: MISHMESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.name }}
                  key: {{ $ref.key }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
