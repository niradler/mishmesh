gateway: wss://connect.example.com
token: ${MISHMESH_TOKEN}

allow:
  - 10.0.0.0/8:22;5432

tunnels:
  web:
    proto: http
    addr: 3000
    subdomain: app
    policy:
      request_headers_add:
        X-Forwarded-By: mishmesh
      ip_allow:
        - 203.0.113.0/24

  db:
    proto: tcp
    addr: 127.0.0.1:5432
    port: 10050

  api:
    proto: tls
    addr: 127.0.0.1:8443
    domain: api.example.com
