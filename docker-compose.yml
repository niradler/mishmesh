services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mishmesh
      POSTGRES_PASSWORD: mishmesh_dev_change_me
      POSTGRES_DB: mishmesh
    volumes:
      - mishmesh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishmesh -d mishmesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MISHMESH_DATA_BACKEND: postgres
      MISHMESH_DATA_DSN: postgres://mishmesh:mishmesh_dev_change_me@postgres:5432/mishmesh?sslmode=disable
      MISHMESH_BASE_DOMAIN: localhost:8080
      MISHMESH_BOOTSTRAP_TOKEN: mm_dev_bootstrap_change_me
      MISHMESH_API_AUTH_DISABLED: "true"
      MISHMESH_WEBUI_ENABLED: "true"
      MISHMESH_METRICS_ENABLED: "true"
      MISHMESH_TCP_PORT_MIN: "10000"
      MISHMESH_TCP_PORT_MAX: "10010"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:10000-10010:10000-10010"
    depends_on:
      postgres:
        condition: service_healthy

  whoami:
    image: traefik/whoami
    expose:
      - "80"

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command:
      - http
      - whoami:80
      - --subdomain
      - demo
      - --gateway
      - ws://server:8081
      - --token
      - mm_dev_bootstrap_change_me
    restart: unless-stopped
    depends_on:
      - server
      - whoami

volumes:
  mishmesh-pg: {}
