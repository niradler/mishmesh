name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - name: profiling harness
        run: |
          go vet ./.claude/scripts/loadtest/lt ./.claude/scripts/loadtest/ltserver
          go build -o /tmp/mishmesh-loadtest ./.claude/scripts/loadtest/lt
          go build -o /tmp/mishmesh-loadtest-server ./.claude/scripts/loadtest/ltserver
      - run: go test -race -count=1 $(go list ./... | grep -v '/internal/store/postgres$')
      - name: postgres store tests
        run: |
          set -o pipefail
          go test -race -count=1 -v ./internal/store/postgres/ | tee /tmp/pg-tests.log
          if grep -q -- '--- SKIP' /tmp/pg-tests.log; then echo "postgres store tests were skipped"; exit 1; fi
        env:
          MISHMESH_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - run: helm lint deploy/helm/mishmesh deploy/helm/mishmesh-agent
      - run: |
          for f in deploy/helm/mishmesh/values-*.yaml; do
            helm template t deploy/helm/mishmesh -f "$f" >/dev/null || exit 1
          done
      - run: python3 .claude/scripts/verify-helm-security.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.agent
          push: false
