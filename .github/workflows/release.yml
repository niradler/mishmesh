name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web ui bundle
        run: |
          cd web && npm ci --no-fund --no-audit && npm run build && cd ..
          mkdir -p dist-web
          tar -C web/dist -czf "dist-web/mishmesh-webui_${GITHUB_REF_NAME#v}.tar.gz" .
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: mishmesh-server
            file: Dockerfile
          - name: mishmesh-agent
            file: Dockerfile.agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in deploy/helm/mishmesh deploy/helm/mishmesh-agent; do
            helm package "$chart" --version "$version" --app-version "$version" -d dist-charts
          done
          for pkg in dist-charts/*.tgz; do
            helm push "$pkg" "oci://${REGISTRY}/charts"
          done
