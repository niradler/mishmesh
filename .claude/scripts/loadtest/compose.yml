name: w5

x-server: &server
  image: alpine:latest
  networks: [lt]
  command: ["${SERVER_BIN:-/bin/w5/mishmesh-server}"]
  cpus: ${SERVER_CPUS:-4}
  mem_limit: ${SERVER_MEM:-8g}
  ulimits:
    nofile: 1048576
  volumes:
    - ${W5_BIN}:/bin/w5:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &server-env
    MISHMESH_BASE_DOMAIN: lt.test
    MISHMESH_PUBLIC_SCHEME: http
    MISHMESH_API_AUTH_DISABLED: "true"
    MISHMESH_INGRESS_ADDR: 0.0.0.0:8080
    MISHMESH_API_ADDR: 0.0.0.0:8081
    MISHMESH_DATA_BACKEND: postgres
    MISHMESH_DATA_DSN: postgres://mishmesh:mishmesh@postgres:5432/mishmesh?sslmode=disable
    MISHMESH_CONN_BACKEND: ${CONN_BACKEND:-memory}
    MISHMESH_REDIS_URL: redis://redis:6379
    MISHMESH_CLUSTER_ENABLED: ${CLUSTER:-false}
    MISHMESH_CLUSTER_SECRET: cluster-loadtest-secret-0123456789abcdef
    MISHMESH_RELAY_ADDR: 0.0.0.0:7443
    MISHMESH_TCP_ENABLED: "false"
    MISHMESH_LOG_LEVEL: warn
    LT_PG_POOL: ${LT_PG_POOL:-0}
    GOGC: ${GOGC:-100}

services:
  postgres:
    image: postgres:16-alpine
    networks: [lt]
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONN:-100}"]
    environment:
      POSTGRES_USER: mishmesh
      POSTGRES_PASSWORD: mishmesh
      POSTGRES_DB: mishmesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishmesh -d mishmesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    networks: [lt]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  server-a:
    <<: *server
    environment:
      <<: *server-env
      MISHMESH_NODE_ID: server-a
      MISHMESH_RELAY_ADVERTISE: server-a:7443

  server-b:
    <<: *server
    environment:
      <<: *server-env
      MISHMESH_NODE_ID: server-b
      MISHMESH_RELAY_ADVERTISE: server-b:7443

  lt:
    image: alpine:latest
    networks: [lt]
    command: ["sleep", "infinity"]
    cpus: ${LT_CPUS:-12}
    ulimits:
      nofile: 1048576
    volumes:
      - ${W5_BIN}:/bin/w5:ro
      - ${W5_OUT}:/out

networks:
  lt: {}
